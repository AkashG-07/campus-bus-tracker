{% extends "base.html" %}
{% block title %}Register - Campus Bus Tracker{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:30px auto;">
  <h2>Student registration</h2>
  <form method="post">
    <label>Name<input type="text" name="name" required></label>
    <label>College email{% if domain %} (@{{ domain }}){% endif %}<input type="email" name="email" required></label>
    <label>Password (min 6 characters)<input type="password" name="password" minlength="6" required></label>
    <button type="submit">Register</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
